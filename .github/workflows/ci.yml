name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/tkda-desktop-tool/Cargo.toml --all -- --check
      - run: cargo test --manifest-path tools/tkda-desktop-tool/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path tools/tkda-desktop-tool/Cargo.toml --all-targets -- -D warnings
      - run: bash -n scripts/bootstrap.sh scripts/up.sh scripts/down.sh scripts/status.sh
