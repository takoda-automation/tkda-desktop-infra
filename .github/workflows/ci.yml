name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path tools/tkda-desktop-tool/Cargo.toml --all -- --check
      - run: cargo test --manifest-path tools/tkda-desktop-tool/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path tools/tkda-desktop-tool/Cargo.toml --all-targets -- -D warnings
      - run: bash -n scripts/bootstrap.sh scripts/up.sh scripts/down.sh scripts/status.sh scripts/cloudflare-tunnel.sh
