name: desktop-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate desktop appliance boundary
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "json"

          compose_path = ".ores-compose.yaml"
          abort "missing #{compose_path}" unless File.file?(compose_path)
          doc = YAML.safe_load(File.read(compose_path), permitted_classes: [], permitted_symbols: [], aliases: false)
          appliance = JSON.parse(File.read("appliance.json"))

          abort "wrong compose schema" unless doc["schema_version"] == "ores.compose.v1"
          abort "wrong appliance schema" unless appliance["schema"] == "ores.desktop-appliance/v1"
          abort "unexpected public IP requirement" unless appliance.dig("host", "requires_public_ip") == false
          abort "cloudflare credentials may not live in repo" unless appliance.dig("cloudflare", "credentials_in_repo") == false
          abort "orchestrator must be ores-compose" unless appliance.dig("orchestrator", "engine") == "ores-compose"
          abort "canonical compose path drifted" unless appliance.dig("orchestrator", "config") == compose_path

          source = doc.fetch("source")
          commit = source.fetch("commit")
          abort "source commit must be immutable 40-hex" unless commit.match?(/\A[0-9a-f]{40}\z/)
          abort "checkout must live under tmp/dev" unless source.fetch("checkout_dir").start_with?("tmp/dev/")
          abort "source must be credential-free GitHub HTTPS" unless source.fetch("repository").match?(%r{\Ahttps://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git\z})

          daemon = doc.fetch("services").fetch("daemon")
          abort "daemon must use host runtime" unless daemon["runtime"] == "host"
          abort "daemon must build before start" unless daemon["build"] == [["cargo", "build", "--release"]]
          command = daemon.fetch("command")
          abort "daemon must run the built release binary directly" unless command.length == 1 && command.first.start_with?("./target/release/")
          abort "local compose must not start a public tunnel" if doc.fetch("services").key?("tunnel")

          rendered = File.read(compose_path)
          abort "non-loopback bind found" if rendered.include?("0.0.0.0") || rendered.include?("[::]")
          if daemon["healthcheck"]
            listen = appliance.dig("host", "daemon_listen")
            health = daemon.dig("healthcheck", "command").join(" ")
            abort "healthcheck must target the appliance loopback daemon" unless health.include?("http://#{listen}/")
          end

          if (component = Array(appliance["components"]).find { |c| c["name"] == "desktop-daemon" })
            repo = source.fetch("repository").sub(%r{\Ahttps://github\.com/}, "").sub(/\.git\z/, "")
            abort "desktop-daemon component repo/source mismatch" unless component["repo"] == repo
            abort "desktop-daemon component rev/source mismatch" unless component["rev"] == commit
          end

          public_config = appliance.dig("orchestrator", "public_config")
          mode = appliance.dig("cloudflare", "mode")
          ready = appliance.dig("cloudflare", "public_ingress_ready")
          origin_auth = appliance.dig("cloudflare", "origin_auth")

          case mode
          when "not-required"
            abort "not-required mode may not declare public config" unless public_config.nil?
            abort "not-required mode must not be public-ready" unless ready == false
            abort "not-required mode must be outbound-agent-only" unless origin_auth == "outbound-agent-only"
            abort "not-required mode origin must be null" unless appliance.dig("cloudflare", "origin").nil?
          when "gated"
            abort "gated mode may not declare public config" unless public_config.nil?
            abort "gated mode must not be public-ready" unless ready == false
            abort "gated mode requires a distinct remote-auth bridge" unless origin_auth == "dedicated-remote-auth-required"
            abort "gated mode must explain its blocker" if appliance.dig("cloudflare", "promotion_reason").to_s.empty?
          when "remotely-managed"
            abort "public mode must declare canonical public config" unless public_config == ".ores-compose.public.yaml"
            abort "remote-managed mode must be public-ready" unless ready == true
            abort "remote-managed mode requires dedicated remote auth" unless origin_auth == "dedicated-remote-auth"
            abort "tunnel token must be file-backed" unless appliance.dig("cloudflare", "token_source") == "file"
          else
            abort "unknown cloudflare mode"
          end

          if public_config.nil?
            abort "gated/not-required appliance may not ship a runnable public compose profile" if File.exist?(".ores-compose.public.yaml")
          end

          gates = appliance.fetch("promotion_gates", {})
          abort "daemon lockfile gate must be explicit" unless gates.key?("daemon_lockfile_committed")
          if gates["daemon_lockfile_committed"] == false
            abort "candidate docs may not claim locked Cargo reproducibility" if Dir["README.md", "docs/**/*.md"].any? { |p| File.read(p).include?("cargo build --locked") }
          end

          if appliance["product"] == "takoda"
            required = %w[TKDA_AGENT_URL TKDA_AGENT_ID TKDA_AGENT_TOKEN_FILE TKDA_LOCAL_CONTROL_TOKEN_FILE]
            inherited = daemon.fetch("inherit_env", [])
            abort "Takoda agent credential/identity contract incomplete" unless (required - inherited).empty?
          end
          RUBY
