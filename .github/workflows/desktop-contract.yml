name: desktop-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: desktop-contract-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ORES_COMMON_DESKTOP_REVISION: 7bb4ed89ab4aa4a81c5e26e36b91f58d6313cc7c

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Mint read-only fleet GitHub App token
        id: app-token
        if: ${{ vars.FLEET_GITHUB_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.FLEET_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.FLEET_GITHUB_APP_PRIVATE_KEY }}
          owner: ORESoftware
          repositories: ores-common-desktop-infra
          permission-contents: read

      - name: Require approved common-layer credential
        env:
          COMMON_REPO_TOKEN: ${{ steps.app-token.outputs.token || secrets.FLEET_GITHUB_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$COMMON_REPO_TOKEN" || {
            echo "Configure FLEET_GITHUB_APP_CLIENT_ID + FLEET_GITHUB_APP_PRIVATE_KEY, or FLEET_GITHUB_READ_TOKEN, to consume the private common desktop layer" >&2
            exit 1
          }

      - name: Check out exact common desktop layer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ORESoftware/ores-common-desktop-infra
          ref: ${{ env.ORES_COMMON_DESKTOP_REVISION }}
          path: tmp/dev/ores-common-desktop-infra
          token: ${{ steps.app-token.outputs.token || secrets.FLEET_GITHUB_READ_TOKEN }}
          persist-credentials: false

      - name: Verify exact common revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C tmp/dev/ores-common-desktop-infra rev-parse HEAD)"
          test "$actual" = "$ORES_COMMON_DESKTOP_REVISION"

      - name: Validate through common desktop implementation
        env:
          ORES_COMMON_DESKTOP_EXPECTED_REVISION: ${{ env.ORES_COMMON_DESKTOP_REVISION }}
        run: |
          cargo run --locked \
            --manifest-path tmp/dev/ores-common-desktop-infra/daemon/rust/Cargo.toml \
            --bin ores-common-desktop-consumer-check

      - name: Validate Takoda-specific substrate boundary
        shell: bash
        run: |
          ruby <<'RUBY'
          require "json"
          require "yaml"

          native = JSON.parse(File.read("appliance.json"))
          ores = JSON.parse(File.read("ores-desktop-appliance.json"))
          compose = YAML.safe_load(File.read(".ores-compose.yaml"), permitted_classes: [], permitted_symbols: [], aliases: false)

          component = native.fetch("components").find { |item| item["name"] == "desktop-daemon" }
          abort "native appliance missing desktop-daemon component" unless component
          source = compose.fetch("source")
          abort "native/source revision mismatch" unless component["rev"] == source["commit"]

          daemon = compose.fetch("services").fetch("daemon")
          env = daemon.fetch("environment")
          abort "Takoda control API must remain loopback" unless env["TKDA_LOCAL_CONTROL_BIND"] == "127.0.0.1:18087"
          abort "Takoda supervisor target must remain loopback" unless env["TKDA_LOCAL_SUPERVISOR_BIND"] == "127.0.0.1:18088"
          abort "Scintilla must remain the long-lived supervisor owner" unless env["TKDA_LAUNCH_SUPERVISOR"] == "false"
          abort "native appliance must deny arbitrary remote shell" unless native.dig("invariants", "arbitrary_remote_shell") == false
          abort "native appliance must keep browser-control ports loopback-only" unless native.dig("invariants", "browser_control_ports_loopback_only") == true
          abort "native common-layer pin gate drifted" unless native.dig("promotion_gates", "common_desktop_infra_pinned") == true
          abort "ORES common revision drifted" unless ores.dig("common_layer", "revision") == ENV.fetch("ORES_COMMON_DESKTOP_REVISION")
          RUBY
