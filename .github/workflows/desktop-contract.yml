name: desktop-contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Takoda desktop orchestration projection
        shell: bash
        run: |
          ruby <<'RUBY'
          require "yaml"
          require "json"

          compose = YAML.safe_load(File.read(".ores-compose.yaml"), permitted_classes: [], permitted_symbols: [], aliases: false)
          native = JSON.parse(File.read("appliance.json"))
          ores = JSON.parse(File.read("ores-desktop-appliance.json"))

          abort "native appliance schema drifted" unless native["schema"] == "tkda.desktop-appliance/v1"
          abort "ORES appliance schema drifted" unless ores["schema"] == "ores.desktop-appliance/v1"
          abort "ORES Compose project schema drifted" unless compose["schema_version"] == "ores.compose.v1"

          source = compose.fetch("source")
          abort "source must be credential-free GitHub HTTPS" unless source.fetch("repository") == "https://github.com/takoda-automation/tkda-desktop-daemon.git"
          abort "source commit must be immutable 40-hex" unless source.fetch("commit").match?(/\A[0-9a-f]{40}\z/)
          abort "checkout must stay under tmp/dev" unless source.fetch("checkout_dir").start_with?("tmp/dev/")

          component = native.fetch("components").find { |item| item["name"] == "desktop-daemon" }
          abort "native appliance missing desktop-daemon component" unless component
          abort "native/source repo mismatch" unless component["repo"] == "takoda-automation/tkda-desktop-daemon"
          abort "native/source revision mismatch" unless component["rev"] == source["commit"]

          daemon = compose.fetch("services").fetch("daemon")
          abort "daemon must run on host" unless daemon["runtime"] == "host"
          abort "daemon must build before start" unless daemon["build"] == [["cargo", "build", "--release"]]
          abort "daemon must execute the release binary directly" unless daemon["command"] == ["./target/release/tkda-desktop-daemon"]

          required = %w[TKDA_AGENT_URL TKDA_AGENT_ID TKDA_AGENT_TOKEN_FILE TKDA_LOCAL_CONTROL_TOKEN_FILE]
          inherited = daemon.fetch("inherit_env", [])
          abort "required agent identity/credential file inputs missing" unless (required - inherited).empty?
          env = daemon.fetch("environment")
          abort "control API must be loopback" unless env["TKDA_LOCAL_CONTROL_BIND"] == "127.0.0.1:18087"
          abort "supervisor target must be loopback" unless env["TKDA_LOCAL_SUPERVISOR_BIND"] == "127.0.0.1:18088"
          abort "Scintilla must own long-lived supervisor lifecycle" unless env["TKDA_LAUNCH_SUPERVISOR"] == "false"

          abort "native appliance must deny arbitrary remote shell" unless native.dig("invariants", "arbitrary_remote_shell") == false
          abort "native appliance must keep browser control loopback-only" unless native.dig("invariants", "browser_control_ports_loopback_only") == true

          abort "ORES projection must not require a public IP" unless ores.dig("host", "requires_public_ip") == false
          abort "Takoda must remain outbound-agent-only" unless ores.dig("cloudflare", "mode") == "not-required"
          abort "Takoda must not be public-ready" unless ores.dig("cloudflare", "public_ingress_ready") == false
          abort "Takoda origin auth mode drifted" unless ores.dig("cloudflare", "origin_auth") == "outbound-agent-only"
          abort "Takoda may not declare a public compose profile" unless ores.dig("orchestrator", "public_config").nil?
          abort "unexpected public compose profile" if File.exist?(".ores-compose.public.yaml")
          abort "daemon lockfile gate must remain explicit" unless ores.dig("promotion_gates", "daemon_lockfile_committed") == false
          RUBY
