schema_version: ores.compose.v1
project: takoda-desktop
allow_lazy_start: false
source:
  repository: https://github.com/takoda-automation/tkda-desktop-daemon.git
  commit: 2ca8e0f8fcd1bf1554ad356054b9bb41b9f76452
  checkout_dir: tmp/dev/tkda-desktop-daemon
services:
  scintilla:
    runtime: host
    command: ["scintilla-desktop-daemon"]
  daemon:
    runtime: host
    depends_on: [scintilla]
    build:
      - ["cargo", "build", "--release"]
    command: ["./target/release/tkda-desktop-daemon"]
    inherit_env:
      - TKDA_AGENT_URL
      - TKDA_AGENT_ID
      - TKDA_AGENT_TOKEN_FILE
      - TKDA_LOCAL_CONTROL_TOKEN_FILE
      - TKDA_SCINTILLA_TOKEN_FILE
    environment:
      TKDA_LOCAL_CONTROL_BIND: "127.0.0.1:18087"
      TKDA_LOCAL_SUPERVISOR_BIND: "127.0.0.1:18088"
      TKDA_SUPERVISOR_RUNTIME: "scintilla"
      TKDA_SCINTILLA_URL: "http://127.0.0.1:8765"
      TKDA_LAUNCH_SUPERVISOR: "true"
