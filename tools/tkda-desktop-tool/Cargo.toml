[package]
name = "tkda-desktop-tool"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["v4"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
